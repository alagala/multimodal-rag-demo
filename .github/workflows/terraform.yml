name: Terraform

on:
  push:
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:

jobs:
  validate:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.4.0'

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/envs/dev fmt -check

      - name: Terraform init
        run: terraform -chdir=infra/terraform/envs/dev init -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/envs/dev validate

  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.4.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: terraform -chdir=infra/terraform/envs/dev init -input=false

      - name: Terraform plan
        id: plan
        run: terraform -chdir=infra/terraform/envs/dev plan -out=tfplan -input=false

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/envs/dev/tfplan

  apply:
    name: Terraform Apply (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.4.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/envs/dev

      - name: Terraform apply
        run: terraform -chdir=infra/terraform/envs/dev apply -input=false infra/terraform/envs/dev/tfplan
